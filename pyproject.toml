[project]
name = "doc-checker"
version = "0.1.0"
description = "Compare and audit PDF and HTML documentation"
authors = [
    { name = "Christophe Le Douarec", email = "ledouarec@gmail.com" },
]
readme = "README.md"
license = "Apache-2.0 AND MPL-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/doc_checker/spell/data/fr/LICENSE",
]
requires-python = ">=3.14"
keywords = [
    "documentation",
    "compare",
    "audit",
    "pdf",
    "html",
    "spelling",
    "accessibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "click>=8.5",
    "cssselect>=1.6",
    "jinja2>=3.1",
    "lxml>=6.1",
    "numpy>=2.5",
    "pillow>=13.0",
    "pypdf>=6.21",
    "pypdfium2>=5.14",
    "rapidfuzz>=3.14",
    "spylls>=0.1.7,<0.2",
]

[project.scripts]
doc-checker = "doc_checker.cli:main"

[project.urls]
Repository = "https://github.com/cledouarec/doc-checker"
Issues = "https://github.com/cledouarec/doc-checker/issues"
Changelog = "https://github.com/cledouarec/doc-checker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf-tables = [
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9",
    "pdfplumber>=0.11.10",
    "pre-commit>=4.5",
    "pytest>=9.0",
    "reportlab>=5.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doc_checker"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "src/doc_checker/__init__.py:__version__",
    "pyproject.toml:^version",
]
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["INP001", "S101", "PLR2004", "DOC201", "DOC501"]
"tools/*" = ["INP001", "T201"]
